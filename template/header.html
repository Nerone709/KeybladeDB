<script>
  document.addEventListener("DOMContentLoaded", function () {
    const utentiToggle = document.getElementById("utentiToggle");
    const utentiSubmenu = document.getElementById("utentiSubmenu");

    utentiToggle.addEventListener("click", function (event) {
      event.preventDefault(); // previene il comportamento del link
      utentiSubmenu.style.display = utentiSubmenu.style.display === "none" ? "block" : "none";
    });

    // Chiudi sottomenù se clicchi altrove
    document.addEventListener("click", function (e) {
      if (!utentiToggle.contains(e.target) && !utentiSubmenu.contains(e.target)) {
        utentiSubmenu.style.display = "none";
      }
    });
  });
</script>
